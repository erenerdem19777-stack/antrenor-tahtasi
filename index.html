*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font-family:inherit}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header,footer{display:flex;align-items:center;gap:2px;padding:4px 6px;background:var(--panel);flex:none;overflow-x:auto;scrollbar-width:none}
header::-webkit-scrollbar,footer::-webkit-scrollbar,.side::-webkit-scrollbar,.ltabs::-webkit-scrollbar{display:none}
header{border-bottom:1px solid var(--line)}
footer{border-top:1px solid var(--line);gap:6px}
.brand{font-weight:800;font-size:15px;margin-right:auto;white-space:nowrap;display:flex;align-items:center;gap:8px;padding-right:10px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.btn{height:40px;min-width:40px;padding:0 8px;border:0;border-radius:10px;background:transparent;color:var(--tx);display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 13px system-ui,sans-serif;cursor:pointer;flex:none;white-space:nowrap}
.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:active{background:var(--panel2)}
.btn.on{background:var(--acc);color:var(--accd)}
.btn:disabled{opacity:.3}
.btn.hl{border:1.5px solid var(--acc);color:var(--acc);padding:0 12px}
.btn.hl.fill{background:var(--acc);color:var(--accd)}
#main{flex:1;display:flex;min-height:0}
.side{flex:none;width:60px;background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;overflow-y:auto;scrollbar-width:none}
#tools{border-right:1px solid var(--line)}
#items{border-left:1px solid var(--line);width:66px}
.side .btn{width:50px;height:44px;padding:0}
.sep{width:36px;height:1px;background:var(--line);margin:4px 0;flex:none}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.3);flex:none;cursor:pointer;margin:2px}
.sw.on{outline:3px solid var(--acc);outline-offset:2px}
.it{width:54px;height:52px;flex-direction:column;gap:2px!important;font-size:10px!important;font-weight:600;color:var(--mut)!important}
.it.on{color:var(--accd)!important}
.ic{display:block;flex:none}
.ic-p{width:22px;height:22px;border-radius:50%;border:2px solid #fff;font:800 10px system-ui;color:#fff;display:flex;align-items:center;justify-content:center}
.ic-ball{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #111;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
.ic-cone{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:20px solid #ff8a00}
.ic-pole{width:5px;height:22px;background:repeating-linear-gradient(#ffd400 0 5px,#e53935 5px 10px);border-radius:3px}
.ic-goal{width:28px;height:14px;border:2px solid #fff;border-bottom:0;background:repeating-linear-gradient(90deg,transparent 0 4px,rgba(255,255,255,.4) 4px 5px)}
.ic-dum{width:10px;height:22px;background:#9c27b0;border-radius:5px 5px 2px 2px}
#stage{flex:1;position:relative;min-width:0;min-height:0;touch-action:none;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:7px 14px;border-radius:20px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#hint.show{opacity:1}
#capOv{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(5,12,8,.86);color:#fff;padding:9px 16px;border-radius:14px;font:700 15px/1.35 system-ui;pointer-events:none;max-width:92%;text-align:center;border:1px solid rgba(255,255,255,.12)}
#capOv b{color:var(--acc);margin-right:6px}
#capOv:empty{display:none}
#cine{position:fixed;inset:0;z-index:9999;background:#050c08;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px}
#cine canvas{position:static;width:min(100%,calc((100vh - 90px)*16/9));height:auto;aspect-ratio:16/9;border-radius:12px;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#vset{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:12px}
#vset .vbox{background:var(--bg2,#11201a);border:1px solid var(--line);border-radius:16px;padding:16px;width:min(520px,100%);max-height:90vh;overflow:auto;color:var(--tx)}
#vset .vrow{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px}
#vset .vrow span{flex:1;font-size:14px}
#vset .vrow.on{border-color:var(--acc)}
#ctabs{margin:0 0 8px}
.cpw{position:relative;margin:0 0 8px;flex-shrink:0}
#cPitch{position:static;display:block;width:100%;height:clamp(150px,30vh,280px);border-radius:12px;background:#0b1a12}
.cpw #cpBig{position:absolute;right:8px;top:8px;opacity:.85}#ctabs button{flex:1}
#clib{display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1;min-height:0}
#clib input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--tx);font-size:15px}
#clib .side-q{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#llist{display:flex;flex-direction:column;gap:6px;padding-bottom:10px}
#llist .lkh{font-weight:800;color:var(--acc);margin-top:6px;font-size:13px;letter-spacing:.5px;text-transform:uppercase}
#llist .lcard{text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--tx);display:flex;flex-direction:column;gap:3px;cursor:pointer}
#llist .lcard:active,#llist .lcard:hover{border-color:var(--acc)}
#llist .lcard span{font-size:12.5px;color:var(--mut)}
#cine .cbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{min-width:40px;height:34px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--tx);font:700 14px system-ui;flex:none;cursor:pointer;padding:0 10px}
.chip.on{background:var(--acc);color:var(--accd);border-color:var(--acc)}
#frameChips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:60px}
#frameChips::-webkit-scrollbar{display:none}
.lbl{font-size:12px;color:var(--mut);font-weight:600;flex:none}
/* drill panel */
#dpanel{flex:none;width:330px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px 20px;-webkit-user-select:text;user-select:text}
#dpanel h2{margin:0 0 6px;font-size:19px;line-height:1.2}
#dpanel h4{margin:16px 0 6px;font-size:12px;color:var(--acc);font-weight:800}
#dpanel p,#dpanel li{font-size:14px;line-height:1.5;margin:0;color:#d3ddd6}
#dpanel ul,#dpanel ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
#dpanel ol li{cursor:pointer;border-radius:6px;padding:2px 4px}
#dpanel ol li.on{background:var(--panel2);color:#fff;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--tx);white-space:nowrap}
.tag.age{background:var(--acc);color:var(--accd);border-color:var(--acc)}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13px;color:#d3ddd6}
.legend svg{width:46px;height:14px}
#dstep{font:700 13px system-ui;color:var(--mut);flex:none;padding:0 6px}
/* screens */
.screen{position:fixed;inset:0;z-index:15;background:var(--bg);display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.m-home #home,body.m-lib #lib{display:flex}
#home{background:radial-gradient(120% 80% at 50% 0%,#1b4a2b 0%,#0d1511 60%);overflow-y:auto}
.hwrap{margin:auto;width:min(900px,100%);padding:28px 20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.hwrap h1{font-size:clamp(28px,6vw,46px);margin:14px 0 6px;line-height:1.05;letter-spacing:-.01em}
.lockup{margin:0 0 6px;line-height:0}.lockup img{width:min(380px,86vw);height:auto;filter:drop-shadow(0 14px 34px rgba(0,0,0,.5))}
.credit{margin:26px 0 0;color:var(--mut);font-size:14px}.credit b{color:var(--acc);font-weight:800}
.hwrap .sub{color:var(--mut);font-size:16px;margin:0 0 26px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;width:100%}
.mcard{border:1px solid var(--line);background:linear-gradient(180deg,#18271f,#121c17);border-radius:20px;padding:22px;color:var(--tx);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:200px;transition:transform .15s,border-color .15s}
.mcard:active{transform:scale(.98)}
.mcard:hover{border-color:var(--acc)}
.mcard svg{width:100%;height:92px}
.mcard b{font-size:21px}
.mcard span{color:var(--mut);font-size:14px;line-height:1.45}
.mcard .go{margin-top:auto;color:var(--acc);font-weight:800;font-size:14px}
.lhead{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.lhead b{font-size:16px}
.ltabs{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;flex:none;background:var(--panel);border-bottom:1px solid var(--line)}
.ltabs .chip{height:40px;font-size:15px;padding:0 16px;white-space:nowrap}
.agef{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}.agef span{font-size:13px;color:var(--mut);margin-right:4px}.agef .chip{height:32px;font-size:13px;padding:0 12px}
.lbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;max-width:1100px;width:100%;margin:0 auto}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.sum h2{margin:0 0 10px;font-size:20px}
.sumg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 18px}
.sumg div{font-size:14px;line-height:1.45;color:#d3ddd6}
.sumg small{display:block;color:var(--acc);font-weight:800;font-size:12px;margin-bottom:2px}
.sum .note{margin-top:12px;font-size:13px;color:var(--mut);line-height:1.5}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.dcard{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--tx);cursor:pointer}
.dcard:active{transform:scale(.99)}
.dcard:hover{border-color:var(--acc)}
.dnum{flex:none;width:38px;height:38px;border-radius:12px;background:var(--panel2);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.dcard b{display:block;font-size:16px;margin-bottom:3px}
.dcard small{display:block;color:var(--acc);font-size:12px;font-weight:700;margin-bottom:6px}
.dcard p{margin:0;color:var(--mut);font-size:13px;line-height:1.45}
.dcard .pl{margin-top:8px;font-size:12px;font-weight:800;color:var(--tx);display:flex;align-items:center;gap:6px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#modal.show{display:flex}
#modal.sheet{background:rgba(0,0,0,.12);align-items:flex-end;padding:0}
#modal.sheet #mbody{width:min(760px,100%);border-radius:18px 18px 0 0;max-height:62vh;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
#mbody{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;width:min(440px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#mbody h3{margin:0 0 12px;font-size:17px}
#mbody label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:10px 0 4px}
#mbody input[type=text],#mbody input:not([type]){width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:600 16px system-ui;padding:0 12px;-webkit-user-select:text;user-select:text}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end;margin-top:16px}
.pb{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);font:700 14px system-ui;cursor:pointer}
.pb.pri{background:var(--acc);color:var(--accd);border-color:var(--acc)}
.pb.dan{background:transparent;color:var(--danger);border-color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;height:38px;border:0;border-radius:8px;background:transparent;color:var(--mut);font:700 13px system-ui;cursor:pointer;min-width:60px}
.seg button.on{background:var(--panel2);color:var(--tx)}
.tsw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;cursor:pointer}
.tsw.on{outline:3px solid var(--acc);outline-offset:2px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.shead h3{margin:0!important}
.trow{margin-top:14px}
.tname{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-bottom:8px}
.tname i{width:18px;height:18px;border-radius:50%;border:2px solid #fff;display:inline-block}
.tname small{color:var(--mut);font-weight:600;font-size:12px}
.fchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.fchip{flex:none;height:46px;min-width:76px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);color:var(--tx);font:800 15px system-ui;cursor:pointer}
.fchip.on{background:var(--acc);border-color:var(--acc);color:var(--accd)}
.fchip.none{color:var(--mut);font-weight:700}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.setrow input[type=color]{width:44px;height:34px;border:0;background:none;padding:0}
.setrow input[type=range]{width:150px}
.setrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.savelist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.saveitem{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:6px 6px 6px 12px}
.saveitem span{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saveitem small{color:var(--mut);font-size:11px;display:block}
#toast{position:fixed;left:50%;bottom:70px;max-width:90vw;text-align:center;transform:translateX(-50%) translateY(20px);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%)}
.muted{color:var(--mut);font-size:12px;line-height:1.5}
/* share / session */
.dcard{position:relative}
.addb{margin-top:10px;height:36px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel2);color:var(--tx);font:800 13px system-ui;cursor:pointer}
.addb.on{background:var(--acc);border-color:var(--acc);color:var(--accd)}
#sbar{position:sticky;bottom:0;margin:0 -16px -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(13,21,17,.96);border-top:1px solid var(--line);display:none;align-items:center;gap:12px}
#sbar.show{display:flex}
#sbar .t{flex:1;font-weight:700;font-size:14px;min-width:0}
#sbar .t small{display:block;color:var(--mut);font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.sitem{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:8px 8px 8px 12px}
.sitem b{flex:1;font-size:14px}.sitem small{color:var(--mut);font-weight:600}
.sitem button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);font:800 15px system-ui;cursor:pointer}
.bigb{width:100%;height:52px;border-radius:12px;border:0;font:800 15px system-ui;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.bigb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bigb.wa{background:#25d366;color:#05301a}
.bigb.vid{background:var(--panel2);color:var(--tx);border:1.5px solid var(--acc)}
.bigb:disabled{opacity:.5}
.prog{margin-top:12px;font-size:13px;color:var(--mut);font-weight:600}
.bar{height:8px;border-radius:5px;background:var(--bg);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.vids video{width:100%;border-radius:10px;background:#000;aspect-ratio:16/9}
#mbody textarea{width:100%;min-height:96px;margin-top:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:500 15px/1.45 system-ui;padding:10px 12px;-webkit-user-select:text;user-select:text;resize:vertical}
.vtp{margin-top:10px;font-size:13px;line-height:1.5;color:#d3ddd6}.vtp ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}.vtp b{color:var(--acc)}
.vtw{margin-top:8px;color:#ffb020;font-size:12.5px}
.shead h3{display:flex;align-items:center;gap:8px}.shead h3 svg{width:24px;height:24px;fill:none;stroke:var(--acc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#modal.sheet.tall #mbody{max-height:86vh;display:flex;flex-direction:column}
.chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px;min-height:160px;max-height:52vh}
.msg{max-width:92%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.45}
.msg.bot{background:var(--panel2);align-self:flex-start;border-top-left-radius:4px}
.msg.me{background:var(--acc);color:var(--accd);align-self:flex-end;border-top-right-radius:4px;font-weight:600}
.msg .ptitle{font-weight:800;font-size:15px;margin-bottom:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg .steps,.msg .gor{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.msg .muted{font-size:12.5px}
.pb.sm{height:34px;padding:0 10px;font-size:12.5px;margin:3px 2px}
.pb.wa2{background:#25d366;color:#05301a;border-color:#25d366}
.chips2{display:flex;gap:4px;overflow-x:auto;padding:6px 0;scrollbar-width:none;flex:none}.chips2 .pb{flex:none}
.cin{display:flex;gap:6px;align-items:flex-end;flex:none}.cin textarea{flex:1;margin:0!important;min-height:48px!important}
.cin .btn{height:48px;width:48px;flex:none;border-radius:12px}
/* mode visibility */
body.m-drill #tools,body.m-drill #items,body.m-drill #fbar,body.m-drill .bo{display:none!important}
body:not(.m-drill) #dpanel,body:not(.m-drill) #dbar,body:not(.m-drill) .dr{display:none!important}
body.m-home #capOv,body.m-lib #capOv{display:none!important}
@media (orientation:portrait){
 #main{flex-direction:column}
 .side{width:auto!important;height:58px;flex-direction:row;padding:0 6px;overflow-x:auto;overflow-y:hidden}
 #tools{border-right:0;border-bottom:1px solid var(--line)}
 #items{border-left:0;border-top:1px solid var(--line);order:3}
 #dpanel{width:auto;order:4;border-left:0;border-top:1px solid var(--line);max-height:40%;flex:none}
 .sep{width:1px;height:30px;margin:0 4px}
 .brand .bt{display:none}
 .hide-p{display:none}
 #capOv{font-size:13px;bottom:8px}
}

<button type="submit">Giriş</button><div class="err" id="gerr"></div>
<div class="hint">Şifre bu cihazda hatırlanır, bir kez girmeniz yeterli.</div>
</form></div>
<script>
(function(){
 var H='b87f31e2d5902da865cf5564a7a5e3b246848deff227573d38e2ac488e47e533', g=document.getElementById('gate');
 function ok(){g.classList.add('hide');}
 try{ if(localStorage.getItem('tb_gate')===H) ok(); }catch(e){}
 function norm(p){return p.trim().replace(/i/g,'İ').replace(/ı/g,'I').toUpperCase();}
 async function sha(t){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');}
 document.getElementById('gform').addEventListener('submit',async function(e){
  e.preventDefault(); var v=document.getElementById('gpw').value;
  var h=await sha(norm(v));
  if(h===H){ try{localStorage.setItem('tb_gate',H);}catch(_ ){} ok(); }
  else { document.getElementById('gerr').textContent='Şifre yanlış'; document.getElementById('gpw').select(); }
 });
})();
</script>

DRILLS.forEach(d=>{d.age=d.yas[0];});
DRILLS.forEach((d,i)=>d.id=i);

/* ---------- Drill builder: steps → animation frames ---------- */
const PT=['A','B','GKA','GKB','N'];
function holderOf(objs,ball){let best=null,bd=1.7;objs.forEach(o=>{if(o.type!=='player')return;const d=Math.hypot(o.x-ball.x,o.y-ball.y);if(d<bd){bd=d;best=o;}});return best;}
function autoArrows(A,B){
 const mb=new Map(B.map(o=>[o.id,o])), out=[], drib=new Set();
 A.filter(o=>o.type==='ball').forEach(a=>{
  const b=mb.get(a.id); if(!b||Math.hypot(b.x-a.x,b.y-a.y)<1.5) return;
  const h=holderOf(A,a), hb=h&&mb.get(h.id);
  if(h&&Math.hypot(hb.x-b.x,hb.y-b.y)<1.8){drib.add(h.id); out.push({type:'dribble',color:'#ffb020',w:3,pts:[[h.x,h.y],[hb.x,hb.y]]}); return;}
  const shot=b.x<.6||b.x>104.4||A.some(g=>g.type==='goal'&&Math.hypot(g.x-b.x,g.y-b.y)<2);
  out.push({type:'arrow',color:shot?'#ff3b30':'#ffffff',w:3,pts:[[a.x,a.y],[b.x,b.y]]});
 });
 A.filter(o=>o.type==='player'&&!drib.has(o.id)).forEach(a=>{
  const b=mb.get(a.id); if(!b||Math.hypot(b.x-a.x,b.y-a.y)<2.5) return;
  out.unshift({type:'run',color:(a.team==='B'||a.team==='GKB')?'#8fd0ff':'#ffd400',w:2.5,pts:[[a.x,a.y],[b.x,b.y]]});
 });
 return out;
}
function buildDrill(d){
 let id=1; const key={}, bo=d.bo||[.8,.6];
 const base=[];
 d.o.forEach(([k,t,x,y,e])=>{
  const o={id:id++}; key[k]=o.id;
  if(typeof x==='string'){const h=base.find(b=>b.id===key[x]); o.x=h.x+bo[0]; o.y=h.y+bo[1];} else {o.x=x;o.y=y;}
  if(PT.includes(t)){o.type='player';o.team=t;o.num=e??'';o.name='';}
  else{o.type=t; if(t==='goal') o.ang=e||0;}
  base.push(o);
 });
 const players=base.filter(o=>o.type!=='ball'), balls=base.filter(o=>o.type==='ball');
 const fr=[{objects:players.concat(balls),drawings:[],cap:''}];
 d.s.forEach(st=>{
  const prev=fr[fr.length-1], nx=prev.objects.map(o=>({...o})), byId=new Map(nx.map(o=>[o.id,o])), m=st.m||{};
  const movedKeys=new Set(Object.keys(m).map(k=>key[k]));
  for(const k in m){const v=m[k]; if(Array.isArray(v)){const o=byId.get(key[k]); o.x=v[0]; o.y=v[1];}}
  for(const k in m){const v=m[k]; if(typeof v==='string'){const o=byId.get(key[k]), p=byId.get(key[v]); o.x=p.x+bo[0]; o.y=p.y+bo[1];}}
  prev.objects.forEach(pb=>{
   if(pb.type!=='ball'||movedKeys.has(pb.id)) return;
   const h=holderOf(prev.objects,pb); if(!h) return; const hn=byId.get(h.id);
   if(hn.x!==h.x||hn.y!==h.y){const b=byId.get(pb.id); b.x=hn.x+(pb.x-h.x); b.y=hn.y+(pb.y-h.y);}
  });
  prev.drawings=autoArrows(prev.objects,nx); prev.cap=st.t;
  fr.push({objects:nx,drawings:[],cap:''});
 });
 fr[fr.length-1].cap=d.end||'Tekrar: oyuncular yer değiştirerek devam eder';
 return fr;
}

/* =================== STATE =================== */
let S={colA:'#e53935',colB:'#1e88e5',colGKA:'#fdd835',colGKB:'#43a047',size:1,lw:3,names:true,field:'grass',view:'full',vrect:null,orient:'auto',ghost:true,speed:1,fmt:'11',fA:'11|4-4-2',fB:'11|4-3-3',voice:true,vvoice:'',ttsName:'',ttsPitch:1.05,session:[],team:'',where:''};
let frames=[{objects:[],drawings:[]}], fi=0, uid=1;
let tool='move', color='#ffffff', placing=null, playing=false, playTok=0;
let undoStack=[], redoStack=[];
let mode='home', curDrill=null, boardSaved=null, libAge='', libTema='rondo', panelOpen=true;
const cur=()=>frames[fi];
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const cv=$('#cv'); let ctx=cv.getContext('2d'); const MAINCTX=ctx;
let dpr=1, CW=0, CH=0, V={};

/* ---------- View transform ---------- */
function computeView(){
 const m=3.5;
 let wx0=-m, wy0=-m, ww=FL+2*m, wh=FW+2*m;
 if(mode==='drill'&&curDrill){[wx0,wy0,ww,wh]=curDrill.view;}
 else if(S.view==='half'){wx0=FL/2-3; ww=FL/2+3+m;}
 else if(S.view==='custom'&&S.vrect){[wx0,wy0,ww,wh]=S.vrect;}
 let vertical=S.orient==='v'||(S.orient==='auto'&&CH>CW*1.05);
 if(mode==='drill'&&S.orient==='auto') vertical=Math.min(CW/wh,CH/ww)>Math.min(CW/ww,CH/wh)*1.08;
 const sw=vertical?wh:ww, sh=vertical?ww:wh;
 // altyazı sahanın üstüne binmesin: ana tahtada alt kısımda yer ayır
 const res=(ctx===MAINCTX&&(mode==='drill'||frames.some(f=>f.cap)))?(CW<700?40:50):0;
 const s=Math.min(CW/sw,(CH-res)/sh);
 V={wx0,wy0,ww,wh,vertical,s,ox:(CW-sw*s)/2,oy:(CH-res-sh*s)/2};
}
function w2s(x,y){return V.vertical?[V.ox+(y-V.wy0)*V.s,V.oy+(V.wx0+V.ww-x)*V.s]:[V.ox+(x-V.wx0)*V.s,V.oy+(y-V.wy0)*V.s];}
function s2w(X,Y){return V.vertical?[V.wx0+V.ww-(Y-V.oy)/V.s,(X-V.ox)/V.s+V.wy0]:[(X-V.ox)/V.s+V.wx0,(Y-V.oy)/V.s+V.wy0];}
function baseR(){return Math.max(11,Math.min(26,V.s*1.75))*S.size;}

/* ---------- Pitch ---------- */
function drawPitch(){
 const F=FIELDS[S.field]||FIELDS.grass;
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.fillStyle=F.bg; ctx.fillRect(0,0,CW,CH);
 const s=V.s*dpr;
 if(!V.vertical) ctx.setTransform(s,0,0,s,(V.ox-V.wx0*V.s)*dpr,(V.oy-V.wy0*V.s)*dpr);
 else ctx.setTransform(0,-s,s,0,(V.ox-V.wy0*V.s)*dpr,(V.oy+(V.wx0+V.ww)*V.s)*dpr);
 ctx.save();
 ctx.beginPath(); ctx.rect(V.wx0,V.wy0,V.ww,V.wh); ctx.clip();
 ctx.fillStyle=F.out; ctx.fillRect(-10,-10,FL+20,FW+20);
 const n=12; for(let i=0;i<n;i++){ctx.fillStyle=i%2?F.s1:F.s2;ctx.fillRect(i*FL/n,0,FL/n+.02,FW);}
 if(mode==='drill'&&curDrill&&curDrill.view[2]<40&&curDrill.view[3]<34&&curDrill.view[0]>20&&curDrill.view[0]+curDrill.view[2]<FL-20){ctx.restore();ctx.setTransform(dpr,0,0,dpr,0,0);return;}
 ctx.strokeStyle=F.line; ctx.fillStyle=F.line; ctx.lineWidth=Math.max(.14,1.8/V.s); ctx.lineJoin='round';
 const st=f=>{ctx.beginPath();f();ctx.stroke();};
 const dot=(x,y,r)=>{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();};
 st(()=>ctx.rect(0,0,FL,FW));
 st(()=>{ctx.moveTo(FL/2,0);ctx.lineTo(FL/2,FW);});
 st(()=>ctx.arc(FL/2,FW/2,9.15,0,Math.PI*2));
 const dr=Math.max(.3,2.2/V.s);
 dot(FL/2,FW/2,dr); dot(11,FW/2,dr); dot(FL-11,FW/2,dr);
 st(()=>ctx.rect(0,13.84,16.5,40.32)); st(()=>ctx.rect(FL-16.5,13.84,16.5,40.32));
 st(()=>ctx.rect(0,24.84,5.5,18.32)); st(()=>ctx.rect(FL-5.5,24.84,5.5,18.32));
 const a=Math.acos(5.5/9.15);
 st(()=>ctx.arc(11,FW/2,9.15,-a,a)); st(()=>ctx.arc(FL-11,FW/2,9.15,Math.PI-a,Math.PI+a));
 st(()=>ctx.arc(0,0,1,0,Math.PI/2)); st(()=>ctx.arc(FL,0,1,Math.PI/2,Math.PI));
 st(()=>ctx.arc(FL,FW,1,Math.PI,1.5*Math.PI)); st(()=>ctx.arc(0,FW,1,1.5*Math.PI,2*Math.PI));
 ctx.fillStyle=F.goal;
 ctx.fillRect(-2,30.34,2,7.32); ctx.fillRect(FL,30.34,2,7.32);
 st(()=>ctx.rect(-2,30.34,2,7.32)); st(()=>ctx.rect(FL,30.34,2,7.32));
 ctx.restore();
 ctx.setTransform(dpr,0,0,dpr,0,0);
}

/* ---------- Objects ---------- */
function teamColor(t){return {A:S.colA,B:S.colB,GKA:S.colGKA,GKB:S.colGKB,N:'#eceff1'}[t]||'#999';}
function txtColor(hex){const c=hex.replace('#','');const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);return (r*299+g*587+b*114)/1000>150?'#111':'#fff';}
function objHitR(o){const r=baseR();return ({player:r,ball:r*.6,cone:r*.65,pole:r*.5,dummy:r*.6,goal:r*1.5})[o.type]||r;}
function drawObj(o,alpha=1){
 const [X,Y]=w2s(o.x,o.y), r=baseR();
 ctx.save(); ctx.globalAlpha=alpha;
 if(o.type==='player'){
  const c=teamColor(o.team);
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(X+r*.12,Y+r*.22,r,r*.9,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=c; ctx.beginPath(); ctx.arc(X,Y,r,0,Math.PI*2); ctx.fill();
  ctx.lineWidth=Math.max(2,r*.13); ctx.strokeStyle=txtColor(c)==='#111'?'#222':'#fff'; ctx.stroke();
  const num=String(o.num??'');
  ctx.fillStyle=txtColor(c); ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`800 ${r*(num.length>2?.78:1.02)}px system-ui,sans-serif`;
  ctx.fillText(num,X,Y+r*.05);
  if(S.names&&o.name){
   const fs=Math.max(10,r*.72); ctx.font=`700 ${fs}px system-ui,sans-serif`;
   ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.75)'; ctx.lineJoin='round';
   ctx.strokeText(o.name,X,Y+r+fs*.75); ctx.fillStyle='#fff'; ctx.fillText(o.name,X,Y+r+fs*.75);
  }
 } else if(o.type==='ball'){
  const br=r*.55;
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(X+br*.2,Y+br*.3,br,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(X,Y,br,0,Math.PI*2); ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle='#111'; ctx.stroke();
  ctx.fillStyle='#111'; ctx.beginPath();
  for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;ctx.lineTo(X+Math.cos(a)*br*.42,Y+Math.sin(a)*br*.42);} ctx.fill();
  for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;ctx.beginPath();ctx.moveTo(X+Math.cos(a)*br*.42,Y+Math.sin(a)*br*.42);ctx.lineTo(X+Math.cos(a)*br,Y+Math.sin(a)*br);ctx.stroke();}
 } else if(o.type==='cone'){
  const h=r*1.1,w=r*.7;

/* ---------- Geometry helpers ---------- */
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function densify(p){
 if(p.length<3) return p.slice();
 const out=[p[0]]; let prev=p[0];
 for(let i=1;i<p.length-1;i++){
  const c=p[i], e=i===p.length-2?p[i+1]:[(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2];
  for(let t=.125;t<=1.0001;t+=.125){const u=1-t;out.push([u*u*prev[0]+2*u*t*c[0]+t*t*e[0],u*u*prev[1]+2*u*t*c[1]+t*t*e[1]]);}
  prev=e;
 }

}
function resample(p,step){
 if(p.length<2) return p.slice();
 const out=[p[0]]; let acc=0;
 for(let i=1;i<p.length;i++){
  let a=p[i-1], b=p[i], d=dist(a,b);
  while(acc+d>=step&&d>0){const t=(step-acc)/d; const q=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]; out.push(q); a=q; d=dist(a,b); acc=0;}
  acc+=d;
 }

}
function pathLen(p){let L=0;for(let i=1;i<p.length;i++)L+=dist(p[i-1],p[i]);return L;}
function wave(p){
 const r=resample(p,3), L=r.length, total=pathLen(r), out=[]; let acc=0;

  if(i>0) acc+=dist(r[i-1],r[i]);
  const a=r[Math.max(0,i-1)], b=r[Math.min(L-1,i+1)], dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy)||1;
  const amp=(acc<8||acc>total-20)?0:5, off=amp*Math.sin(acc/15*2*Math.PI);
  out.push([r[i][0]-dy/len*off,r[i][1]+dx/len*off]);

}
function rdp(pts,eps){

 const a=pts[0], b=pts[pts.length-1]; let mx=0, idx=0;
 for(let i=1;i<pts.length-1;i++){const d=segDist(pts[i],a,b); if(d>mx){mx=d;idx=i;}}
 if(mx>eps){const l=rdp(pts.slice(0,idx+1),eps), r=rdp(pts.slice(idx),eps); return l.slice(0,-1).concat(r);}
 return [a,b];
}
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy; let t=l2?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l2:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);}

/* ---------- Drawings ---------- */
const isArea=d=>d.type==='rect'||d.type==='circle';
function shapeScreen(d){
 const pts=d.pts.map(p=>w2s(p[0],p[1]));
 if(['arrow','run','dribble','pen'].includes(d.type)){let dp=densify(pts); if(d.type==='dribble') dp=wave(dp); return dp;}
 return pts;
}
function drawShape(d){
 const lw=(d.w||3)*Math.max(.8,Math.min(1.4,V.s/9));
 ctx.save(); ctx.strokeStyle=d.color; ctx.fillStyle=d.color; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.lineJoin='round';
 if(d.type==='text'){
  const [X,Y]=w2s(d.pts[0][0],d.pts[0][1]), fs=Math.max(14,Math.min(30,V.s*2.1))*S.size;
  ctx.font=`800 ${fs}px system-ui,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=4; ctx.strokeStyle=txtColor(d.color)==='#111'?'rgba(0,0,0,.7)':'rgba(255,255,255,.85)'; ctx.strokeText(d.text,X,Y); ctx.fillText(d.text,X,Y);
  ctx.restore(); return;
 }
 const p=shapeScreen(d);
 if(p.length<2){ctx.restore();return;}
 if(isArea(d)){
  const x=Math.min(p[0][0],p[1][0]), y=Math.min(p[0][1],p[1][1]), w=Math.abs(p[1][0]-p[0][0]), h=Math.abs(p[1][1]-p[0][1]);

  ctx.globalAlpha=.22; ctx.fill(); ctx.globalAlpha=.95; ctx.lineWidth=Math.max(2,lw*.7); ctx.setLineDash([8,5]); ctx.stroke();
  ctx.restore(); return;
 }
 if(d.type==='run') ctx.setLineDash([lw*3,lw*2.4]);
 const hasHead=['arrow','run','dribble'].includes(d.type), head=lw*4.2+6;
 let line=p;
 if(hasHead){
  const L=pathLen(p);
  if(L>head){
   if(d.type==='dribble') line=p.slice(0,Math.max(2,Math.round(p.length*(1-(head*.6)/L))));
   else{const r=resample(p,2); let acc=0,k=r.length-1; for(let i=r.length-1;i>0;i--){acc+=dist(r[i],r[i-1]); if(acc>=head*.6){k=i;break;}} line=r.slice(0,k+1);}

  ctx.setLineDash([]);
  const e=p[p.length-1]; let b=p[p.length-2], acc=0;
  for(let i=p.length-2;i>=0;i--){acc+=dist(p[i+1],p[i]); b=p[i]; if(acc>=head) break;}
  const ang=Math.atan2(e[1]-b[1],e[0]-b[0]);
  ctx.beginPath(); ctx.moveTo(e[0],e[1]);
  ctx.lineTo(e[0]-head*Math.cos(ang-.42),e[1]-head*Math.sin(ang-.42));
  ctx.lineTo(e[0]-head*.7*Math.cos(ang),e[1]-head*.7*Math.sin(ang));
  ctx.lineTo(e[0]-head*Math.cos(ang+.42),e[1]-head*Math.sin(ang+.42));

}
function hitDrawing(X,Y){

  const d=ds[i];
  if(d.type==='text'){const [x,y]=w2s(d.pts[0][0],d.pts[0][1]); const fs=Math.max(14,V.s*2.1); ctx.font=`800 ${fs}px system-ui`; const w=ctx.measureText(d.text).width/2+8; if(Math.abs(X-x)<w&&Math.abs(Y-y)<fs*.8) return d; continue;}
  const p=shapeScreen(d);
  if(isArea(d)){
   const x0=Math.min(p[0][0],p[1][0]),x1=Math.max(p[0][0],p[1][0]),y0=Math.min(p[0][1],p[1][1]),y1=Math.max(p[0][1],p[1][1]);
   if(d.type==='rect'){if(X>=x0-6&&X<=x1+6&&Y>=y0-6&&Y<=y1+6) return d;}
   else{const cx=(x0+x1)/2,cy=(y0+y1)/2,rx=(x1-x0)/2+6,ry=(y1-y0)/2+6; if(((X-cx)/rx)**2+((Y-cy)/ry)**2<=1) return d;}
  } else if(polyDist([X,Y],p)<14) return d;

}
function hitObject(X,Y){

 for(let i=os.length-1;i>=0;i--){const o=os[i],[x,y]=w2s(o.x,o.y); if(Math.hypot(X-x,Y-y)<=objHitR(o)+8) return o;}

/* ---------- History & persistence ---------- */

function undo(){if(!undoStack.length)return; redoStack.push(snap()); restore(undoStack.pop());}
function redo(){if(!redoStack.length)return; undoStack.push(snap()); restore(redoStack.pop());}
function persist(){const b=boardSaved||{frames,fi}; LS.set('tb_state',{frames:b.frames,fi:b.fi,S});}

}

/* ---------- Pointer handling (board only) ---------- */
const ptrs=new Map(); let lastTap={id:null,t:0}, longTimer=null;
const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
const clampW=(x,y)=>[Math.max(V.wx0+.5,Math.min(V.wx0+V.ww-.5,x)),Math.max(V.wy0+.5,Math.min(V.wy0+V.wh-.5,y))];

 if(mode!=='board'||playing||$('#modal').classList.contains('show')) return;
 e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(_){}
 const [X,Y]=pos(e), [wx,wy]=s2w(X,Y);
 if(placing){const [cx,cy]=clampW(wx,wy); addObject(placing,cx,cy); return;}
 if(tool==='move'){
  const o=hitObject(X,Y);
  if(o){
   const now=Date.now();
   if(lastTap.id===o.id&&now-lastTap.t<350){lastTap={id:null,t:0};openEdit(o);return;}
   lastTap={id:o.id,t:now};
   const os=cur().objects; os.splice(os.indexOf(o),1); os.push(o);
   selObj=o;
   ptrs.set(e.pointerId,{k:'obj',o,dx:o.x-wx,dy:o.y-wy,moved:false,sx:X,sy:Y});
   clearTimeout(longTimer); longTimer=setTimeout(()=>{const s=ptrs.get(e.pointerId); if(s&&!s.moved){ptrs.delete(e.pointerId);openEdit(o);}},600);
   render(); return;
  }
  const d=hitDrawing(X,Y);
  if(d){ptrs.set(e.pointerId,{k:'drw',d,last:[wx,wy],moved:false}); return;}
  selObj=null; render(); return;
 }
 if(tool==='eraser'){const st={k:'erase',did:false}; ptrs.set(e.pointerId,st); eraseAt(X,Y,st); return;}
 if(tool==='text'){askText('Metin ekle','',t=>{if(!t)return; beginChange(); cur().drawings.push({type:'text',text:t,color,pts:[[R2(wx),R2(wy)]]}); afterChange();}); return;}
 if([...ptrs.values()].some(s=>s.k==='draw')) return;
 const d={type:tool,color,w:S.lw,pts:[[wx,wy]]};
 if(['line','rect','circle'].includes(tool)) d.pts.push([wx,wy]);

});
cv.addEventListener('pointermove',e=>{
 const st=ptrs.get(e.pointerId); if(!st) return;
 e.preventDefault();
 const [X,Y]=pos(e), [wx,wy]=s2w(X,Y);
 if(st.k==='obj'){
  if(!st.moved&&Math.hypot(X-st.sx,Y-st.sy)<4) return;
  if(!st.moved){beginChange(); st.moved=true; clearTimeout(longTimer);}
  const [cx,cy]=clampW(wx+st.dx,wy+st.dy); st.o.x=R2(cx); st.o.y=R2(cy); render();
 } else if(st.k==='drw'){
  if(!st.moved){beginChange(); st.moved=true;}
  const dx=wx-st.last[0], dy=wy-st.last[1]; st.d.pts.forEach(p=>{p[0]=R2(p[0]+dx);p[1]=R2(p[1]+dy);}); st.last=[wx,wy]; render();
 } else if(st.k==='draw'){
  const d=st.d;
  if(['line','rect','circle'].includes(d.type)) d.pts[1]=[wx,wy];
  else if(Math.hypot(X-st.lx,Y-st.ly)>3){d.pts.push([wx,wy]); st.lx=X; st.ly=Y;}
  render();
 } else if(st.k==='erase') eraseAt(X,Y,st);
},{passive:false});
function endPtr(e){
 const st=ptrs.get(e.pointerId); if(!st) return; ptrs.delete(e.pointerId); clearTimeout(longTimer);
 if(st.k==='obj'||st.k==='drw'){if(st.moved) afterChange();}
 else if(st.k==='erase'){if(st.did) afterChange();}
 else if(st.k==='draw'){
  const d=st.d; drawingNow=null;
  if(finalize(d)){beginChange(); cur().drawings.push(d); afterChange();} else render();

}
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
function finalize(d){

  if(d.pts.length<2||pathLen(sp)<12) return false;
  d.pts=rdp(d.pts,(d.type==='pen'?1.2:6)/V.s);

}

}

/* ---------- Animation ---------- */
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
/* ---------- Telefon eklentilerine erişim ----------
   Uygulama paketlenmeden (tek HTML) çalıştığı için Capacitor.Plugins boş gelir.
   Eklentiye doğrudan köprü üzerinden (nativePromise) ulaşıyoruz. */

function nativePlugin(name){

  return _np[name]||(_np[name]=new Proxy({},{get:(_,m)=>typeof m==='string'&&m!=='then'?(o)=>C.nativePromise(name,m,o||{}):undefined}));

}
/* ---------- Sesli anlatım (TTS) ---------- */

  if(tf) return tf.speak({text,lang:'tr-TR',rate:1.05,pitch:pt,voice:vn}).catch(()=>c?c.speak({text,lang:'tr-TR',rate:1.05,pitch:pt,volume:1.0,category:'playback'}):null).catch(e=>{if(!this.warned){this.warned=true; voiceHelp(e);}});
  if(c) return c.speak({text,lang:'tr-TR',rate:1.05,pitch:pt,volume:1.0,category:'playback'}).catch(e=>{if(!this.warned){this.warned=true; voiceHelp(e);}});
  if(!('speechSynthesis' in window)) return Promise.resolve();
  return new Promise(res=>{
   let done=false; const fin=()=>{if(!done){done=true;res();}};
   try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='tr-TR'; u.rate=1.05; u.pitch=pt;
    const tv=speechSynthesis.getVoices().filter(v=>/^tr/i.test(v.lang)); const sc=v=>(/natural|neural|enhanced|premium|online/i.test(v.name)?4:0)+(/google|yelda|emel|ahmet/i.test(v.name)?2:0)+(v.localService===false?1:0); tv.sort((a,b)=>sc(b)-sc(a)); const pick=vn&&tv.find(v=>v.name===vn); if(pick||tv[0]) u.voice=pick||tv[0];
    u.onend=fin; u.onerror=fin; speechSynthesis.speak(u);
    setTimeout(fin,Math.min(20000,1500+text.length*90));
   }catch(e){fin();}
  });
 },
 stop(){const c=this.cap(), tf=nativePlugin('TtsFile'); try{c&&c.stop();}catch(e){} try{tf&&tf.stop().catch(()=>{});}catch(e){} try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}}
};
try{window.speechSynthesis&&speechSynthesis.getVoices();}catch(e){}

const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
/* ---------- Doğal, motive eden anlatım ---------- */
const NUMW=['sıfır','bir','iki','üç','dört','beş','altı','yedi','sekiz','dokuz','on','on bir'];
function sayable(t){
 let s=String(t||'');
 s=s.replace(/1\s*['’]\s*e\s*1/g,'bire bir').replace(/(\d)\s*\+\s*(\d)/g,(m,a,b)=>NUMW[a]+' artı '+NUMW[b])
  .replace(/(\d+),\d+\s*m\b/g,'$1 metre').replace(/\b(\d)-(\d)-(\d)(?:-(\d))?\b/g,(...a)=>a.slice(1,5).filter(Boolean).map(d=>NUMW[d]).join(' '))
  .replace(/\b(\d)\s*[-–]\s*(\d)\b/g,(m,a,b)=>NUMW[a]+' '+NUMW[b])
  .replace(/(\d{1,2})\s*[’']\s*([a-zçğıöşü]+)/g,(m,n,suf)=>(+n<=11?NUMW[+n]:n)+suf)
  .replace(/\d{1,2}(?!\d)/g,(m,off,str)=>{ if(off>0&&/[\d.,]/.test(str[off-1])) return m; const n=+m; if(n>11) return m; const af=str.slice(off+m.length);
   if(/^\s*(numara|metre|m\b|saniye|dakika|dk|kişi|oyuncu|pas|hat|adım|kat)/.test(af)) return NUMW[n]; return NUMW[n]+' numara';})
  .replace(/\s*[·•→|]\s*/g,', ').replace(/\s*:\s*/g,', ').replace(/\s*\+\s*/g,' ve ').replace(/[()]/g,', ').replace(/[–—]/g,' ')
  .replace(/\bGOL!?/gi,'Ve gol!').replace(/\s+,/g,',').replace(/(,\s*)+,/g,',').replace(/,\s*$/,'').replace(/,\s*([.!?])/g,'$1').replace(/\s+/g,' ').trim();
 return s;
}
const _hash=t=>{let h=0; for(const c of String(t)) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h);};
function narrationScript(title,desc,caps,kind){
 const h=_hash(title);
 const INTRO=kind==='drill'
  ?['Hadi gençler, toplanın! Şimdi','Haydi başlıyoruz! Bugünkü çalışmamız','Dikkat, herkes beni dinlesin! Sıradaki çalışma']
  :['Beyler, toplanın! Bugünkü planımız','Hadi beyler, dikkat! Maçı bu şekilde kazanacağız','Arkadaşlar, beni iyi dinleyin! Planımız'];
 const LINK=['Sonra,','Hemen ardından,','Şimdi,','Arkasından,','Dikkat,'];
 const OUTRO=kind==='drill'
  ?['Harika! Yüksek tempo, bol iletişim. Hadi göreyim sizi!','İşte bu! Konsantrasyon ve enerji, sahada da böyle yapıyoruz!','Süper! Her tekrarda daha iyi olacağız. Hadi!']
  :['İşte bu kadar! Herkes görevini biliyor. Sahaya çıkıyoruz ve birlikte yapıyoruz. Hadi beyler!','Bu planı herkes uygularsa kazanırız. Cesaret, iletişim, mücadele. Size inanıyorum!','Harika! Birlikte savunuyoruz, birlikte hücum ediyoruz. Hadi, bu maçı alıyoruz!'];
 const n=caps.length, steps=caps.map((c,i)=>{
  const s=sayable(c); if(!s) return '';
  if(/^ve gol/i.test(s)) return 'Ve gol! İşte bu!';
  const lead=i===0?'Önce,':(i===n-1&&n>2?'Ve son olarak,':LINK[(h+i)%LINK.length]);
  return lead+' '+s.charAt(0).toLocaleLowerCase('tr-TR')+s.slice(1)+(/[.!?]$/.test(s)?'':'.');
 });
 return {intro:`${INTRO[h%INTRO.length]}: ${sayable(String(title).replace(/\s*\([^)]*\)/g,''))}. ${desc?sayable(desc):''}`.trim(), steps, outro:OUTRO[h%OUTRO.length]};
}
function frameCaps(fr){return fr.slice(0,-1).map(f=>f.cap||'');}
function stepText(i){const n=frames.length-1; if(i>=n||!frames[i].cap) return ''; return narrationScript(curDrill?curDrill.ad:'',null,frameCaps(frames),mode==='drill'?'drill':'tactic').steps[i];}
function interp(A,B,k){
 const map=new Map(A.objects.map(o=>[o.id,o])), bIds=new Set(B.objects.map(o=>o.id));
 const objs=B.objects.map(o=>{const a=map.get(o.id); return a?{...o,x:a.x+(o.x-a.x)*k,y:a.y+(o.y-a.y)*k}:{...o,_a:k};});
 A.objects.forEach(o=>{if(!bIds.has(o.id)) objs.unshift({...o,_a:1-k});});
 return objs;
}
function stopPlay(){playing=false; playTok++; TTS.stop(); updateUI(); render();}
function togglePlay(){playing?stopPlay():play(mode==='drill');}
function play(loop){
 if(playing){stopPlay();return;}
 if(frames.length<2){toast('Animasyon için en az 2 kare ekleyin (alttaki + düğmesi)');return;}
 playing=true; selObj=null; const tok=++playTok;
 let i=fi>=frames.length-1?0:fi; fi=i; let t0=performance.now(), phase='hold', loopN=0, ready=true;
 const narr=idx=>{
  if(!S.voice||loopN>0||!(mode==='drill'?curDrill:frames.some(f=>f.cap))){ready=true;return;}
  const sc=narrationScript(mode==='drill'?curDrill.ad:'',mode==='drill'?curDrill.amac:null,frameCaps(frames),mode==='drill'?'drill':'tactic');
  let txt=idx>=frames.length-1?sc.outro:sc.steps[idx]; if(idx===0&&mode==='drill') txt=`${sc.intro} ${txt}`;
  if(!txt){ready=true;return;}
  ready=false; TTS.speak(txt).then(()=>{if(tok===playTok) ready=true;});
 };
 narr(i);
 const dur=()=>1500/S.speed, hold=()=>((mode==='drill'?250:150)*(i>=frames.length-1?6:1))/S.speed;
 updateUI(); render();
 const step=now=>{
  if(!playing||tok!==playTok) return;
  if(phase==='hold'){
   if(now-t0<hold()||!ready){requestAnimationFrame(step);return;}
   if(i>=frames.length-1){
    if(loop){i=0; fi=0; loopN++; t0=now; narr(0); updateUI(); render(); requestAnimationFrame(step); return;}
    playing=false; updateUI(); render(); return;
   }
   phase='move'; t0=now;
  }
  const t=Math.min(1,(now-t0)/dur());
  const A=frames[i], B=frames[i+1];
  render(interp(A,B,ease(t)),A.drawings);
  if(t>=1){i++; fi=i; phase='hold'; t0=now; narr(i); updateUI(); render();}
  requestAnimationFrame(step);
 };
 requestAnimationFrame(step);
}

function pcmToWav(pcm,sr,name){

async function pickVideoCodec(W,H){
 if(!window.VideoEncoder||!window.VideoFrame||typeof Mp4Muxer==='undefined') return null;
 for(const codec of ['avc1.42001f','avc1.4d001f','avc1.640028','avc1.42E01E','avc1.42002a']){

   try{const r=await VideoEncoder.isConfigSupported(cfg); if(r&&r.supported) return cfg;}catch(e){}
  }

}
async function pickAudioCodec(sr){

 for(const [codec,mux] of [['mp4a.40.2','aac'],['opus','opus']]){
  for(const rate of [sr,48000,44100]){

}

async function encodeMp4(W,H,total,drawFn,oc,pcm,sr,vcfg,acodec,onProg){

  audio:pcm&&acodec?{codec:acodec.mux,numberOfChannels:1,sampleRate:acodec.cfg.sampleRate}:undefined,fastStart:'in-memory',firstTimestampBehavior:'offset'});
 let err=null;
 const venc=new VideoEncoder({output:(ch,meta)=>muxer.addVideoChunk(ch,meta),error:e=>err=e});
 venc.configure(vcfg);
 const FPS=30, N=Math.ceil(total/1000*FPS);
 for(let k=0;k<N;k++){
  if(err) throw err;
  drawFn(k*1000/FPS);
  const vf=new VideoFrame(oc,{timestamp:Math.round(k*1e6/FPS),duration:Math.round(1e6/FPS)});
  venc.encode(vf,{keyFrame:k%60===0}); vf.close();
  if(venc.encodeQueueSize>6) await new Promise(r=>{const w=()=>venc.encodeQueueSize>3?setTimeout(w,4):r(); w();});
  if(k%6===0){onProg&&onProg(k/N*.95); await new Promise(r=>setTimeout(r,0));}

  const aenc=new AudioEncoder({output:(ch,meta)=>muxer.addAudioChunk(ch,meta),error:e=>err=e});
  aenc.configure(acodec.cfg);
  const rate=acodec.cfg.sampleRate, data=rate===sr?pcm:(()=>{const k=sr/rate,n=Math.floor(pcm.length/k),o=new Float32Array(n);for(let i=0;i<n;i++)o[i]=pcm[Math.floor(i*k)];return o;})();

}

  if(voice==='mic'){
   mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
   for(let c=3;c>0;c--){status(`Kayıt ${c} saniye içinde başlıyor — animasyonu izleyerek anlatın`); await new Promise(r=>setTimeout(r,1000));}
   if(vcfg){
    micRec=new MediaRecorder(mic); micRec.ondataavailable=e=>{if(e.data&&e.data.size) micChunks.push(e.data);};
    const stopped=new Promise(r=>micRec.onstop=r); micRec.start();
    status('Kayıt sürüyor — konuşun'); const t0=performance.now();
    await new Promise(res=>{const tick=()=>{const t=performance.now()-t0; drawAt(Math.min(t,total)); onProg&&onProg(Math.min(1,t/total)*.5); if(t>=total){res();return;} requestAnimationFrame(tick);}; requestAnimationFrame(tick);});
    micRec.stop(); await stopped; micRec=null;
    try{micBuf=await ac.decodeAudioData(await new Blob(micChunks).arrayBuffer());}catch(e){throw new Error('Ses kaydı okunamadı: '+(e&&e.message||e));}
   }
  }
  if(vcfg){
   // --- yeni yol: kare kare kodlama, gerçek MP4 ---
   let pcm=null, sr=48000, acodec=null, nativeAudio=false;
   if(clips||micBuf){
    acodec=await pickAudioCodec(ac?ac.sampleRate:48000);
    const MD=nativePlugin('Medya');
    if((!acodec||acodec.mux!=='aac')&&MD){acodec={cfg:{sampleRate:44100},mux:'native'}; nativeAudio=true;}
    else if(acodec&&acodec.mux!=='aac'&&!MD) acodec=null; // Opus’u WhatsApp her yerde oynatmaz: eski yola dön
    if(acodec){
     sr=acodec.cfg.sampleRate; pcm=new Float32Array(Math.ceil(total/1000*sr)+sr);
     if(clips) segs.forEach(s=>{if(!s.clip) return; const d=resampleAudio(s.clip,sr), off=Math.round((s.t/1000+0.05)*sr); for(let i=0;i<d.length&&off+i<pcm.length;i++) pcm[off+i]+=d[i];});
     if(micBuf){const d=resampleAudio(micBuf,sr); pcm.set(d.subarray(0,Math.min(d.length,pcm.length)));}
    }
   }
   if(pcm||!wantAudio){
    status('Video hazırlanıyor');
    const base=voice==='mic'?.5:0;
    const buf=await encodeMp4(W,H,total,drawAt,oc,nativeAudio?null:pcm,sr,vcfg,nativeAudio?null:acodec,p=>onProg&&onProg(base+p*(1-base)));
    const f=new File([buf],`${slug(o.title)}.mp4`,{type:'video/mp4'}); f._clean=true; f._dur=Math.round(total);
    if(nativeAudio&&pcm) f._wav=pcmToWav(pcm,sr,`${slug(o.title)}.wav`);
    return f;
   }
  }
  // --- eski yol (WebCodecs yoksa): gerçek zamanlı kayıt ---
  const mime=pickMime(wantAudio); if(!mime) throw new Error('Bu cihaz video kaydını desteklemiyor');
  const dest=ac?ac.createMediaStreamDestination():null;
  if(mic&&dest) ac.createMediaStreamSource(mic).connect(dest);
  const vstream=oc.captureStream(30);
  const stream=new MediaStream([...vstream.getVideoTracks(),...(wantAudio&&dest?dest.stream.getAudioTracks():[])]);
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:3000000,audioBitsPerSecond:128000}), chunks=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size) chunks.push(e.data);};
  const stopped=new Promise(r=>rec.onstop=r);
  if(/Chrome\//.test(navigator.userAgent)) rec.start(250); else rec.start();
  const t0=performance.now();
  if(clips&&dest){const a0=ac.currentTime+0.03; segs.forEach(s=>{if(!s.clip) return; const src=ac.createBufferSource(); src.buffer=s.clip; src.connect(dest); src.connect(ac.destination); src.start(a0+s.t/1000);});}
  status(voice==='mic'?'Kayıt sürüyor — konuşun':'Video kaydediliyor');
  await new Promise(res=>{const tick=()=>{const t=performance.now()-t0; drawAt(Math.min(t,total)); onProg&&onProg(Math.min(1,t/total)); if(t>=total){res();return;} requestAnimationFrame(tick);}; requestAnimationFrame(tick);});
  await new Promise(r=>setTimeout(r,200));
  rec.stop(); await stopped; vstream.getTracks().forEach(t=>t.stop());
  const type=mime.split(';')[0], ext=type.includes('mp4')?'mp4':'webm';
  return new File([new Blob(chunks,{type})],`${slug(o.title)}.${ext}`,{type});
 } finally {
  if(mic) mic.getTracks().forEach(t=>t.stop());
  if(ac) try{ac.close();}catch(e){}
 }
}

function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(b);});}

async function writeCache(P,f){
 const buf=new Uint8Array(await f.arrayBuffer()), CH=786432; // 768 KB parçalar
 const b64=u=>{let s='';for(let i=0;i<u.length;i+=32768) s+=String.fromCharCode.apply(null,u.subarray(i,i+32768)); return btoa(s);};
 const path='paylasim/'+f.name;
 const r=await P.Filesystem.writeFile({path,data:b64(buf.subarray(0,CH)),directory:'CACHE',recursive:true});
 for(let o=CH;o<buf.length;o+=CH) await P.Filesystem.appendFile({path,data:b64(buf.subarray(o,o+CH)),directory:'CACHE'});
 return r.uri;
}
async function shareFiles(files,text){
 const P={Share:nativePlugin('Share'),Filesystem:nativePlugin('Filesystem'),Medya:nativePlugin('Medya')};
 if(P.Filesystem&&(P.Medya||P.Share)){
  try{
   shareStatus('Video telefona hazırlanıyor…');
   const uris=[];
   let info='';
   for(const f of files){
    if(!f._uri){
     f._uri=await writeCache(P,f);
     if(P.Medya&&f._wav){
      shareStatus('Ses videoya ekleniyor…');
      try{const wu=await writeCache(P,f._wav); const r=await P.Medya.addAudio({path:f._uri,wav:wu}); f._uri=r.path; f._dur=r.durationMs;}catch(e){f._fixErr=String(e&&e.message||e);}
     }
     if(P.Medya&&!f._clean){
      shareStatus('Video WhatsApp için düzenleniyor…');
      try{const r=await P.Medya.fixVideo({path:f._uri}); f._uri=r.path; f._dur=r.durationMs;}catch(e){f._fixErr=String(e&&e.message||e);}
     }
    }
    uris.push(f._uri);
   }
   const durs=files.filter(f=>f._dur!=null).map(f=>Math.round(f._dur/100)/10+' sn');
   if(durs.length) info=' · süre: '+durs.join(', ');
   const fixErr=files.find(f=>f._fixErr);
   if(fixErr) info+=' · düzeltme yapılamadı ('+esc(fixErr._fixErr)+')';
   if(files.some(f=>f._dur!=null&&f._dur<1000)){shareStatus('Kayıt boş çıktı (süre 0 sn). Lütfen bu yazının ekran görüntüsünü gönderin.'+info,false); return true;}
   let gal='';
   if(P.Medya){
    let n=0;
    for(const f of files){ if(f._saved){n++;continue;} try{await P.Medya.saveToGallery({path:f._uri,name:f._uri.split('/').pop()}); f._saved=true; n++;}catch(e){} }
    if(n) gal=` · ${n} video galeriye kaydedildi (Filmler › Antrenor Tahtasi)`;
    const r=await P.Medya.shareVideos({paths:uris,text,whatsapp:true});
    shareStatus(`✓ ${r.target&&r.target.indexOf('whatsapp')>=0?'WhatsApp açıldı':'Paylaşım menüsü açıldı'} · ${r.count} video · ${Math.round(r.bytes/1048576*10)/10} MB${info}${gal}<br>Video yine görünmezse WhatsApp’ta 📎 → Galeri → “Antrenor Tahtasi” klasöründen seçin.`);
   } else {
    await P.Share.share({title:'Antrenman',text,files:uris,dialogTitle:'WhatsApp ile paylaş'});
    shareStatus('✓ Paylaşım menüsü açıldı');
   }
  }catch(e){ if(!/cancel/i.test(String(e&&e.message))) shareStatus('Paylaşılamadı: '+esc(e&&e.message||e),false); }
  return true;
 }
 try{
  if(navigator.canShare&&navigator.canShare({files})){
   if(IOS){ try{await navigator.clipboard.writeText(text);}catch(_){}
    await navigator.share({files}); shareStatus('✓ Paylaşım açıldı · açıklama panoya kopyalandı, WhatsApp’ta mesaj kutusuna yapıştırabilirsiniz'); }
   else await navigator.share({files,text,title:'Antrenman'});
   return true;
  }
 }catch(e){if(e&&e.name==='AbortError')return true; shareStatus('Paylaşılamadı: '+esc(e&&e.message||e),false); return false;}
 files.forEach(f=>{const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove();});
 toast('Bu önizlemede paylaşım kapalı. APK’da dokununca doğrudan WhatsApp açılır.');
 return false;
}

const TL='a-zçğıöşü';

 [/(defans|savunma)\s*(bloğu|bloku|hattı|dörtlüsü|oyuncuları)?|dörtlü\s*(hat|savunma)|arka\s*dörtlü/,'def','defans bloğu'],
 [/stoper(ler)?/,'cb','stoperler'],[/bek(ler)?(?![${TL}])/,'fb','bekler'],
 [/orta\s*saha(lar|cılar| hattı)?(?![${TL}]*ya\b)/,'mid','orta saha'],
 [/forvet(ler)?|hücum\s*hattı|hücumcular|santrafor/,'fwd','forvetler'],
 [/kanat(lar| oyuncuları)(?![${TL}]*a\b)/,'wing','kanatlar'],
 [/(tüm|bütün)\s*takım|takımın tamamı|(?<![${TL}])blok(?![${TL}])/,'all','tüm takım']
];

function findMentions(cl){

 drib(p,u,v){ if(!p) return; this.owner=p; this.mv(p,u,v); }
 steal(p){ this.give(p); }
 clear(u,v){ const [x,y]=xyOf(u,this.V(v),this.T); this.ball.x=R2(x); this.ball.y=R2(y); this.owner=null; }
 shot(p){ const [x,y]=xyOf(104.7,this.V(33),this.T); this.ball.x=R2(x); this.ball.y=R2(y); this.owner=null; }
 shotAt(T){ const [x,y]=T==='A'?[104.7,35]:[.3,33]; this.ball.x=x; this.ball.y=y; this.owner=null; }
 doReact(){
  if(!this.react) return;
  const opp=this.objs.filter(o=>o.type==='player'&&o.team===this.O&&!this.touched.has(o.id));
  const b=this.ball; opp.map(o=>({o,d:Math.hypot(o.x-b.x,o.y-b.y)})).filter(x=>x.d<26&&x.d>2.5).sort((a,c)=>a.d-c.d).slice(0,2).forEach(({o,d})=>{
   const k=Math.min(.38,(d-2.2)/d); o.x=R2(o.x+(b.x-o.x)*k); o.y=R2(o.y+(b.y-o.y)*k);
  });
 }
 step(cap){ if(this.cap==null) this.start=clone(this.objs); else {this.doReact(); this.snaps.push({cap:this.cap,objs:clone(this.objs)});} this.cap=cap; this.touched=new Set(); }
 done(){
  if(this.cap!=null){this.doReact(); this.snaps.push({cap:this.cap,objs:clone(this.objs)});}
  const out=[{objects:this.start,drawings:[],cap:this.snaps[0]?this.snaps[0].cap:''}];
  this.snaps.forEach((s,i)=>out.push({objects:s.objs,drawings:[],cap:this.snaps[i+1]?this.snaps[i+1].cap:''}));
  for(let i=0;i<out.length-1;i++) out[i].drawings=autoArrows(out[i].objects,out[i+1].objects);
  return out;
 }
}

const KAT_ORDER=['Hücum','Geçiş','Savunma','Duran top'];
let coachRespond=function(text,ctx){
 const t=' '+text.toLocaleLowerCase('tr-TR').replace(/[’`]/g,"'")+' ';
 const T=/rakip (takım )?(için|adına)|mavi takım (için|olarak)/.test(t)?'B':'A';
 let side=null;
 if(/rakib(in)? sağ/.test(t)) side='L'; else if(/rakib(in)? sol/.test(t)) side='R';
 else if(/(?<![a-zçğıöşü])sol/.test(t)) side='L'; else if(/(?<![a-zçğıöşü])sağ/.test(t)) side='R';
 // kısa takip komutları
 if(ctx.last&&/^ *(sol|sağ)( kanat(tan)?| taraftan| taraf)?[ .!]*$/.test(t.trim())) return runPlay(ctx.last.play,T,side,ctx,text,ctx.last.x);
 if(/(ne biliyorsun|neler yapabil|taktik(ler)?i? (listele|göster)|yardım|menü)/.test(t)) return {kind:'help'};
 if(ctx.last&&/(tekrar|yeniden) (oynat|göster)/.test(t)) return {kind:'replay'};
 if(ctx.last&&/(oyunculara|whatsapp|gönder|paylaş)/.test(t)) return {kind:'share'};
 // bilgi bankasından taktik seç
 let best=null,bi=1e9;
 for(const p of PLAYBOOK){ const m=t.match(p.re); if(m&&m.index<bi){best=p;bi=m.index;} }
 if(best){
  const x={};
  if(best.id==='markaj'){
   const ms=findMentions(t); const oT=T==='A'?'B':'A';
   const tm=ms.find(m=>(m.team||oT)===oT)||ms[0];
   const objs=cur().objects;
   x.target=tm?objs.find(o=>o.type==='player'&&baseTeam(o.team)===(tm.team||oT)&&String(o.num)===String(tm.num)):null;
   const mm=ms.find(m=>m!==tm&&(m.team||T)===T);
   const R=assignRoles(objs,T,'R');
   x.marker=mm?objs.find(o=>o.type==='player'&&baseTeam(o.team)===T&&String(o.num)===String(mm.num)):(R&&R.DM);
   if(!x.target) return {kind:'text',text:'Kimi kapatacağımızı yazın. Örnek: “Mavi 10’u kapatalım, 6 numara onu tutsun.”'};
  }
  return runPlay(best,T,side,ctx,text,x);
 }
 // açık komutlar (kırmızı 9 sol çizgiye gider ...)
 const r=parseTactic(text,cur().objects);
 if(r.frames.length>1){
  return {kind:'play',ad:'Senin taktiğin',kat:'Özel',frames:r.frames,warn:r.warn,
   steps:r.frames.slice(0,-1).map(f=>f.desc.join(' · ')||f.cap),
   note:{amac:text.trim(),gorev:[],ilke:[]},auto:false};
 }
 return {kind:'unknown',warn:r.warn};
};
function runPlay(play,T,side,ctx,text,x){
 const auto=play.side&&!side; side=side||'R';
 const objs=cur().objects;
 const s=new TSim(objs,T,side,!play.def);
 if(!s.r) return {kind:'text',text:`${TEAMNAME[T]} takım tahtada yok. Önce “Diziliş” ile takımı yerleştirin.`};
 if(play.def&&!s.o&&play.id!=='markaj') return {kind:'text',text:'Bu savunma taktiği için rakip takım (mavi) da tahtada olmalı. Önce mavi takıma diziliş verin.'};
 try{ play.build(s,s.r,s.o,x||{}); }catch(e){ return {kind:'text',text:'Bu taktiği bu dizilişle kuramadım: '+e.message}; }
 const frames=s.done();
 if(frames.length<2) return {kind:'text',text:'Bu taktik için gerekli oyuncular tahtada eksik.'};
 const gor=(play.gorev(s.r,s.o,x||{})||[]).filter(g=>g[0]).map(([p,txt])=>{
  const role=Object.keys(ROLE_TR).find(k=>s.r[k]===p)||''; return {num:p.num,name:p.name||'',rol:ROLE_TR[role]||'',txt};});
 const sideTxt=play.side?(side==='L'?'sol kanat':'sağ kanat'):'';
 ctx.last={play,side,x};
 return {kind:'play',ad:play.ad+(sideTxt?` (${sideTxt})`:''),kat:play.kat,frames,steps:frames.slice(0,-1).map(f=>f.cap),
  note:{amac:play.amac,gorev:gor,ilke:play.ilke},auto,sideTxt,team:T};
}
function tacticNote(res){
 const L=[`⚽ *Maç Taktiği: ${res.ad}*`]; if(S.team) L.push(`👥 ${S.team}`);
 L.push(`🎯 ${res.note.amac}`);
 if(res.note.gorev.length){L.push('','*Görevler*'); res.note.gorev.forEach(g=>L.push(`• ${g.num}${g.name?' '+g.name:''}${g.rol?' ('+g.rol+')':''}: ${g.txt}`));}
 if(res.steps&&res.steps.length){L.push('','*Adımlar*'); res.steps.forEach((s,i)=>L.push(`${i+1}) ${s}`));}
 if(res.note.ilke.length){L.push('','*Unutma*'); res.note.ilke.forEach(i=>L.push(`• ${i}`));}
 L.push('','Animasyonlu video ekte. 💪');
 return L.join('\n');
}

const nearestPairs=(s,ours,opps)=>{const used=new Set(); return ours.map(p=>{let best=null,bd=1e9; opps.forEach(q=>{if(used.has(q.id))return; const d=Math.hypot(p.x-q.x,p.y-q.y); if(d<bd){bd=d;best=q;}}); if(best) used.add(best.id); return [p,best];});};

{id:'adamadama',ad:'Adam Adama Pres',kat:'Savunma',side:0,def:1,
 re:/adam adama pres|herkes adamını|bire ?bir pres|man.?to.?man|her(kes)? (bir|kendi) oyuncu(yu|sunu) tut/,
 amac:'Rakip geriden kurarken her oyuncumuzun bir rakibi alması; pas seçeneği bırakmamak.',
 ilke:['Herkes en yakın rakibi alır','Kaleciye bir forvet basar','Arkada bir oyuncu fazla kalır (stoper)'],
 gorev:r=>[[r.ST,'Rakip kaleciye ve stopere bas.'],[r.DM,'Rakip 10 numarayı al.'],[r.CB,'Rakip forveti al, arkada bir kişi fazla kal.']],
 build:(s,r,o)=>{ s.give(o.GK);
  s.step('Herkes adamını alır'); const ours=r.all.filter(p=>p!==r.CB); nearestPairs(s,ours,o.all).forEach(([p,q])=>{if(q) s.near(p,q,-1.6,0);});
  s.step('Rakip kaleci pas verir: yakın markaj'); const t=o.CB||o.DM; s.pass(o.GK,t); const m=nearestPairs(s,ours,[t])[0]; if(m&&m[1]) s.near(m[0],t,-1,0);
  s.step('Top kazanıldı'); if(m) s.steal(m[0]); }},

function playById(id){return PLAYBOOK.find(p=>p.id===id);}
/* ---------- Diziliş komutu ---------- */
function formationIntent(t){
 const m=t.match(/(?<![0-9])([3-5])\s*[-–. ]\s*([1-5])\s*[-–. ]\s*([1-5])(?:\s*[-–. ]\s*([1-3]))?(?![0-9])/);
 if(!m) return null;
 const code=[m[1],m[2],m[3],m[4]].filter(Boolean).join('-');
 const name=Object.keys(FORM['11']).find(n=>n.split(' ')[0]===code);
 if(!name) return {err:`${code} dizilişini tanımıyorum. Bildiklerim: ${Object.keys(FORM['11']).join(', ')}`};
 const T=/rakip|mavi/.test(t)?'B':'A';
 return {T,name};
}
/* ---------- Birden fazla taktiği art arda çalıştır ---------- */
function matchPlays(t){
 const hits=[];
 for(const p of PLAYBOOK){ const re=new RegExp(p.re.source,'g'); let m; while((m=re.exec(t))){ hits.push({p,i:m.index,e:m.index+m[0].length}); break; } }
 hits.sort((a,b)=>a.i-b.i||(b.e-b.i)-(a.e-a.i));
 const out=[]; for(const h of hits){ if(out.some(o=>h.i<o.e&&h.e>o.i)) continue; if(out.some(o=>o.p===h.p)) continue; out.push(h); }
 let res=out.slice(0,3).map(h=>h.p);
 const SUB={asirtma:['derinlik'],capraz:['derinlik'],kanatbek:['orta','bindirme'],kisakorner:['korner'],kornersav:['korner'],frikiksav:['frikik'],geckosu:['geri'],tumhucum:['kontra']};
 res=res.filter(p=>!res.some(q=>(SUB[q.id]||[]).includes(p.id)));
 return res;
}
function runChain(list,T,side,ctx,x){
 let results=[], objs=cur().objects, frames=[];
 for(const play of list){
  const sd=side||'R'; const s=new TSim(objs,T,sd,!play.def);
  if(!s.r) return {kind:'text',text:`${TEAMNAME[T]} takım tahtada yok. Önce “Diziliş” ile yerleştirin.`};
  if(play.def&&!s.o) continue;
  try{ play.build(s,s.r,s.o,x||{}); }catch(e){ continue; }
  let f=s.done(); if(f.length<2) continue;
  if(play!==list[list.length-1]){ const k=f.findIndex(fr=>/kazan|kesti|uzaklaştır/i.test(fr.cap||'')); if(k>=0&&k+2<f.length) f=f.slice(0,k+2); }
  frames=frames.length?frames.slice(0,-1).concat(f):f; objs=f[f.length-1].objects;
  results.push({play,gor:(play.gorev(s.r,s.o,x||{})||[]).filter(g=>g[0]).map(([p,txt])=>{const role=Object.keys(ROLE_TR).find(k=>s.r[k]===p)||''; return {num:p.num,name:p.name||'',rol:ROLE_TR[role]||'',txt};})});
 }
 if(!results.length) return {kind:'text',text:'Bu taktikleri tahtadaki dizilişle kuramadım. Savunma taktikleri için rakip takımın da tahtada olması gerekir.'};
 const gmap=new Map(); results.forEach(r=>r.gor.forEach(g=>{const k=String(g.num)+g.rol; if(gmap.has(k)) gmap.get(k).txt+=' Sonra: '+g.txt; else gmap.set(k,{...g});}));
 const sideTxt=results.some(r=>r.play.side)?((side||'R')==='L'?'sol kanat':'sağ kanat'):'';
 ctx.last={chain:list,side:side||'R',x};
 return {kind:'play',ad:results.map(r=>r.play.ad).join(' + ')+(sideTxt?` (${sideTxt})`:''),kat:results.map(r=>r.play.kat).filter((v,i,a)=>a.indexOf(v)===i).join(' · '),
  frames,steps:frames.slice(0,-1).map(f=>f.cap),note:{amac:results.map(r=>r.play.amac).join(' Ardından: '),gorev:[...gmap.values()],ilke:[].concat(...results.map(r=>r.play.ilke)).slice(0,6)},
  auto:results.some(r=>r.play.side)&&!side,sideTxt,team:T};
}
const coachRespondBase=coachRespond.bind(null);
coachRespond=function(text,ctx){
 const t=' '+text.toLocaleLowerCase('tr-TR').replace(/[’`]/g,"'")+' ';
 // diziliş komutu
 const fi_=formationIntent(t);
 if(fi_&&/(geç|oyna|dizil|kur|çık|başla|diziliş|sistem)/.test(t)){
  if(fi_.err) return {kind:'text',text:fi_.err};
  applyFormation(fi_.T,'11',fi_.name); S['f'+fi_.T]='11|'+fi_.name; persist();
  const rest=t.replace(/(?<![0-9])[3-5]\s*[-–. ]\s*[1-5]\s*[-–. ]\s*[1-5](\s*[-–. ]\s*[1-3])?/,'');
  const more=matchPlays(rest);
  if(!more.length) return {kind:'text',text:`${TEAMNAME[fi_.T]} takımı ${fi_.name} dizilişine geçirdim. Şimdi ne yapmak istediğinizi söyleyin.`};
 }
 if(/(ne biliyorsun|neler yapabil|taktik(ler)?i? (listele|göster)|yardım|menü)/.test(t)) return {kind:'help'};
 const T=/rakip (takım )?(için|adına)|mavi takım (için|olarak)/.test(t)?'B':'A';
 let side=null;
 if(/rakib(in)? sağ/.test(t)) side='L'; else if(/rakib(in)? sol/.test(t)) side='R';
 else if(/(?<![a-zçğıöşü])sol/.test(t)) side='L'; else if(/(?<![a-zçğıöşü])sağ/.test(t)) side='R';
 if(ctx.last&&/^ *(sol|sağ)( kanat(tan)?| taraftan| taraf)?[ .!]*$/.test(t.trim())){
  if(ctx.last.chain) return runChain(ctx.last.chain,T,side,ctx,ctx.last.x);
  return runPlay(ctx.last.play,T,side,ctx,text,ctx.last.x);
 }
 if(ctx.last&&/(tekrar|yeniden) (oynat|göster)/.test(t)) return {kind:'replay'};
 if(ctx.last&&/(oyunculara|whatsapp|gönder|paylaş)/.test(t)) return {kind:'share'};
 let list=[], why='';
 for(const [re,id,w] of ADVICE){ if(re.test(t)&&playById(id)){ list=[playById(id)]; why=w; break; } }
 const named=matchPlays(t);
 if(named.length>1||(named.length===1&&!/rakip|yiyoruz|lazım|geride|öndeyiz|kazanıyoruz/.test(t))||!list.length){ if(named.length){ list=named; if(named.length>1) why=''; } }
 if(list.length===1&&list[0].id==='markaj'){ const r=coachRespondBase(text,ctx); if(why&&r.kind==='play') r.why=why; return r; }
 list=list.filter(p=>p.id!=='markaj');
 if(list.length){
  const r=list.length===1?runPlay(list[0],T,side,ctx,text,{}):runChain(list,T,side,ctx,{});
  if(why&&r.kind==='play') r.why=why;
  return r;
 }
 return coachRespondBase(text,ctx);
};

function openCinema(o){

  const r=st.k==='step'?(now-st.t0-LEAD)/MOVE:0;

 };

/* ---------- Wire up ---------- */
const cbox=$('#colors');
COLORS.forEach(c=>{const s=document.createElement('div'); s.className='sw'; s.dataset.c=c; s.style.background=c; s.onclick=()=>{color=c; if(tool==='move'||tool==='eraser'||placing) setTool('arrow'); else updateUI();}; cbox.appendChild(s);});
$$('.tool').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
$$('[data-add]').forEach(b=>b.onclick=()=>{placing=placing===b.dataset.add?null:b.dataset.add; if(placing) tool='move'; updateUI();});
$('#bForm').onclick=openFormations; $('#bForm2').onclick=openFormations;
$('#bUndo').onclick=undo; $('#bRedo').onclick=redo;
$('#bView').onclick=()=>{const order=S.vrect?['full','half','custom']:['full','half']; S.view=order[(order.indexOf(S.view)+1)%order.length]; computeView(); persist(); updateUI(); render();};
$('#bClear').onclick=openClear; $('#bSave').onclick=openSaves; $('#bExport').onclick=exportPNG; $('#bSettings').onclick=openSettings;
$('#bFull').onclick=async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen(); try{await screen.orientation.lock('landscape');}catch(_){}} else await document.exitFullscreen();}catch(_){toast('Tam ekran bu ortamda desteklenmiyor');}};
$('#bPlay').onclick=()=>play(false);
$('#bSpeed').onclick=$('#dSpeed').onclick=()=>{S.speed={1:2,2:.5,.5:1}[S.speed]||1; persist(); updateUI();};
$('#bAddFrame').onclick=()=>{if(playing)return; if(frames.length>=40){toast('En fazla 40 kare');return;} beginChange(); frames.splice(fi+1,0,{objects:clone(cur().objects),drawings:[]}); fi++; afterChange(); toast(`Kare ${fi+1} eklendi • oyuncuları yeni konumlarına taşıyın`);};
$('#bDelFrame').onclick=()=>{if(playing)return; if(frames.length<2){toast('Son kare silinemez');return;} beginChange(); frames.splice(fi,1); fi=Math.max(0,fi-1); afterChange();};
$('#bGhost').onclick=()=>{S.ghost=!S.ghost; persist(); updateUI(); render();};
$('#bHome').onclick=$('#libHome').onclick=()=>setMode('home');
$('#goBoard').onclick=()=>setMode('board');
$('#goLib').onclick=()=>setMode('lib');
$('#bBackLib').onclick=()=>setMode('lib');
$('#bEditDrill').onclick=editDrillOnBoard;
$('#bShareDrill').onclick=()=>openShareDrill(curDrill);
$('#bVideo').onclick=openBoardVideo;

$('#bCoach').onclick=openCoach;
$('#sbarB').onclick=openSession;
$('#dVoice').onclick=()=>{unlockSpeech(); S.voice=!S.voice; persist(); if(!S.voice) TTS.stop(); else if(!TTS.ok()) toast('Bu cihazda sesli okuma desteklenmiyor'); else if(!playing) TTS.speak(stepText(fi)||curDrill.ad); updateUI();};
$('#dPlay').onclick=togglePlay;
const sayStep=()=>{if(S.voice){const t=stepText(fi); t&&TTS.speak(t);}};
$('#dPrev').onclick=()=>{if(playing)stopPlay(); fi=Math.max(0,fi-1); updateUI(); render(); sayStep();};
$('#dNext').onclick=()=>{if(playing)stopPlay(); fi=Math.min(frames.length-1,fi+1); updateUI(); render(); sayStep();};
$('#dInfo').onclick=()=>{panelOpen=!panelOpen; $('#dpanel').style.display=panelOpen?'':'none'; resize();};
document.addEventListener('keydown',e=>{
 if($('#modal').classList.contains('show')){if(e.key==='Escape')closeModal();return;}
 if(mode==='drill'){if(e.key===' '){e.preventDefault();togglePlay();} if(e.key==='ArrowRight')$('#dNext').click(); if(e.key==='ArrowLeft')$('#dPrev').click(); return;}
 if(mode!=='board') return;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault(); e.shiftKey?redo():undo();}
 else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault(); redo();}
 else if((e.key==='Delete'||e.key==='Backspace')&&selObj){beginChange(); cur().objects.splice(cur().objects.indexOf(selObj),1); selObj=null; afterChange();}
 else if(e.key===' '){e.preventDefault(); play(false);}
});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
// Android geri tuşu / tarayıcı geri: modlar arasında dön
window.addEventListener('popstate',()=>{if($('#modal').classList.contains('show')){closeModal();} else if(mode==='drill') setMode('lib'); else if(mode!=='home') setMode('home'); try{history.pushState(null,'');}catch(_){}});
try{history.pushState(null,'');}catch(_){}

function resize(){
 const r=$('#stage').getBoundingClientRect();
 dpr=Math.min(window.devicePixelRatio||1,3); CW=r.width; CH=r.height;
 cv.width=Math.max(1,Math.round(CW*dpr)); cv.height=Math.max(1,Math.round(CH*dpr));
 computeView(); render();
}
if(window.ResizeObserver) new ResizeObserver(resize).observe($('#stage')); else window.addEventListener('resize',resize);

/* ---------- Init ---------- */
const saved=LS.get('tb_state');
if(saved&&Array.isArray(saved.frames)&&saved.frames.length){frames=saved.frames; fi=Math.min(saved.fi||0,frames.length-1); Object.assign(S,saved.S||{}); fixUid();}
else{
 applyFormation('A','11','4-4-2'); applyFormation('B','11','4-3-3');
 cur().objects.push({id:uid++,type:'ball',x:FL/2,y:FW/2});
 undoStack=[]; persist();
}
if(S.libv!==2){S.session=[]; S.libv=2;}
updateUI(); resize();
})();
</script>
<script>
if('serviceWorker' in navigator && location.protocol==='https:'){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
</html>
